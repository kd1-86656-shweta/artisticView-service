spring.application.name=artisticview-service
spring.profiles.default=dev
server.port=${PORT:8080}

# ---- database (Flyway owns the schema; Hibernate only validates it)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# ---- redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ---- auth
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=7d
app.cookie.secure=true
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.frontend-url=${APP_FRONTEND_URL}
app.bootstrap.super-admin-email=${APP_BOOTSTRAP_SUPER_ADMIN_EMAIL:}

# ---- media
app.media.public-base-url=${APP_MEDIA_PUBLIC_BASE_URL:/media}

# ---- ops
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
springdoc.swagger-ui.path=/swagger-ui.html
