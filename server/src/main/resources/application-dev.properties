# Local development defaults. Never used in production.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/artisticview}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Dev-only signing secret. Production must set APP_JWT_SECRET.
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.cookie.secure=false
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

logging.level.com.artisticview=DEBUG
